<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaQL - 数据库查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .query-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .success-message {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
        }

        .success-icon {
            font-size: 24px;
        }

        .placeholder-content {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .feature-list {
            text-align: left;
            margin-top: 20px;
        }

        .feature-list li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .feature-list li::before {
            content: "🔹";
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="query-container">
        <h1>LinguaQL 数据库查询界面</h1>
        
        <div class="success-message">
            <div class="success-icon">🎉</div>
            <div>数据库连接成功！欢迎使用 LinguaQL 查询界面。</div>
        </div>

        <div class="placeholder-content">
            <p>这是一个新的 Tauri 窗口，专门用于数据库查询操作。</p>
            
            <div class="feature-list">
                <h3 style="margin: 20px 0 15px 0; color: #333;">即将支持的功能：</h3>
                <ul style="list-style: none;">
                    <li>自然语言查询转换为 SQL</li>
                    <li>可视化查询结果展示</li>
                    <li>查询历史记录</li>
                    <li>数据导出功能</li>
                    <li>实时查询性能监控</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
